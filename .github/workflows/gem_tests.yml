---
name: gem_tests

"on":
  pull_request:
    branches: [main, "chef-*"]
  push:
    branches: [main, "chef-*"]

permissions:
  contents: read

concurrency:
  group: gem-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CHEF_LICENSE: accept-no-persist
  FORCE_FFI_YAJL: ext

jobs:
  knife-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libarchive-dev libffi-dev libyaml-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.8"
          bundler-cache: true
      - name: Run knife-windows tests
        run: bundle exec tasks/bin/run_external_test chef/knife-windows main rake spec
