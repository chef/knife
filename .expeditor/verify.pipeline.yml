---
expeditor:
  # cached_folders:
  #   - vendor
  defaults:
    buildkite:
      retry:
        automatic:
          limit: 1
      timeout_in_minutes: 90

steps:
  - label: cookstyle-ruby-3.1
    command:
      - .expeditor/run_linux_tests.sh "rake style:cookstyle"
    expeditor:
      executor:
        docker:
          image: ruby:3.1

  - label: cookstyle-ruby-3.4
    command:
      - .expeditor/run_linux_tests.sh "rake style:cookstyle"
    expeditor:
      executor:
        docker:
          image: ruby:3.4

  - label: run-specs-rocky-8-ruby-3.4
    command:
      - .expeditor/run_linux_tests.sh rake spec
    expeditor:
      executor:
        docker:
          image: chefes/omnibus-toolchain-rocky-8:3.0.39
          environment:
            - FORCE_FFI_YAJL=ext
            - CHEF_LICENSE=accept-no-persist
            - CHEF_LICENSE_SERVER=http://hosted-license-service-lb-8000-606952349.us-west-2.elb.amazonaws.com:8000/

  - label: run-specs-rocky-8-aarch64-ruby-3.4
    command:
      - .expeditor/run_linux_tests.sh rake spec
    agents:
      queue: default-privileged-aarch64
    expeditor:
      executor:
        docker:
          image: chefes/omnibus-toolchain-rocky-8:aarch64
          environment:
            - FORCE_FFI_YAJL=ext
            - CHEF_LICENSE=accept-no-persist
            - CHEF_LICENSE_SERVER=http://hosted-license-service-lb-8000-606952349.us-west-2.elb.amazonaws.com:8000/

